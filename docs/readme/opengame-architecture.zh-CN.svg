<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-labelledby="arch-title-zh">
  <title id="arch-title-zh">OpenGame 全栈架构 — 从本地 Agent 与模板复刻到自动化 QA、在线分享与平台上架变现</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --surface-accent: #eef6ff;
      --surface-green: #ecfdf5;
      --border: #d8dee6;
      --border-accent: #93c5fd;
      --border-green: #86efac;
      --text: #111827;
      --muted: #4b5563;
      --chip-bg: #ffffff;
      --arrow: #64748b;
      --accent: #0284c7;
      --green: #059669;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface-accent: #132238;
        --surface-green: #10261e;
        --border: #30363d;
        --border-accent: #1d4ed8;
        --border-green: #15803d;
        --text: #f0f6fc;
        --muted: #9ca3af;
        --chip-bg: #0d1117;
        --arrow: #8b949e;
        --accent: #38bdf8;
        --green: #34d399;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <rect width="1160" height="440" rx="16" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>

  <!-- Header -->
  <text x="32" y="40" font-size="18" font-weight="700" fill="var(--text)">OpenGame 全栈 AI 游戏创作链路</text>
  <text x="32" y="61" font-size="12.5" fill="var(--muted)">一套开源本地运行时，打通 22 个本地 Agent、多模态 BYOK 生成、自动化试玩验证与上架变现路径。</text>

  <!-- Column 1 -->
  <rect x="32" y="88" width="236" height="316" rx="12" fill="var(--surface)" stroke="var(--border)"/>
  <text x="48" y="114" class="mono" font-size="11" font-weight="700" fill="var(--accent)">01 · BYOA 与创作起点</text>
  <text x="48" y="136" font-size="15" font-weight="700" fill="var(--text)">连接你的本地 Agent</text>
  <text x="48" y="155" font-size="11.5" fill="var(--muted)">DeepSeek · Claude Code · Codex</text>
  <text x="48" y="171" font-size="11.5" fill="var(--muted)">WorkBuddy · Gemini · Cursor 等 22 款</text>

  <rect x="48" y="190" width="204" height="54" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="60" y="211" font-size="12.5" font-weight="600" fill="var(--text)">一键复刻爆款模板</text>
  <text x="60" y="229" font-size="11" fill="var(--muted)">内置 26 款 3D / 2D / 9:16 可玩工程</text>

  <rect x="48" y="256" width="204" height="54" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="60" y="277" font-size="12.5" font-weight="600" fill="var(--text)">一键风格化与换皮</text>
  <text x="60" y="295" font-size="11" fill="var(--muted)">保留成熟玩法壳子，替换角色画风音频</text>

  <rect x="48" y="322" width="204" height="54" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="60" y="343" font-size="12.5" font-weight="600" fill="var(--text)">一句话从零做原创</text>
  <text x="60" y="361" font-size="11" fill="var(--muted)">创意描述 + 类型 / 画风 / 世界观</text>

  <!-- Arrow 1->2 -->
  <line x1="274" y1="246" x2="306" y2="246" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Column 2 -->
  <rect x="314" y="88" width="250" height="316" rx="12" fill="var(--surface-accent)" stroke="var(--border-accent)"/>
  <text x="330" y="114" class="mono" font-size="11" font-weight="700" fill="var(--accent)">02 · STUDIO 与 MCP 运行时</text>
  <text x="330" y="136" font-size="15" font-weight="700" fill="var(--text)">OpenGame Studio</text>
  <text x="330" y="155" font-size="11.5" fill="var(--muted)">本地工作台 (/studios/game) + stdio MCP</text>

  <rect x="330" y="176" width="218" height="62" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="342" y="197" font-size="12.5" font-weight="600" fill="var(--text)">12 个游戏专用 MCP 工具</text>
  <text x="342" y="214" class="mono" font-size="9.6" fill="var(--muted)">create, write, validate, simulate</text>
  <text x="342" y="228" class="mono" font-size="9.6" fill="var(--muted)">playtest, cover, trailer, publish</text>

  <rect x="330" y="248" width="218" height="62" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="342" y="269" font-size="12.5" font-weight="600" fill="var(--text)">openmotion-game Skill</text>
  <text x="342" y="286" font-size="11" fill="var(--muted)">18 份工程手册：3C 手感、2D/3D 动画、</text>
  <text x="342" y="300" font-size="11" fill="var(--muted)">试玩广告规范与分级质量门禁</text>

  <rect x="330" y="320" width="218" height="62" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="342" y="341" font-size="12.5" font-weight="600" fill="var(--text)">游戏即开源可编辑代码</text>
  <text x="342" y="358" font-size="11" fill="var(--muted)">HTML5 + JS + 内置 Three.js</text>
  <text x="342" y="372" font-size="11" fill="var(--muted)">design/plan.md · style.md · assets.csv</text>

  <!-- Arrow 2->3 -->
  <line x1="570" y1="246" x2="602" y2="246" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Column 3 -->
  <rect x="610" y="88" width="244" height="316" rx="12" fill="var(--surface)" stroke="var(--border)"/>
  <text x="626" y="114" class="mono" font-size="11" font-weight="700" fill="var(--accent)">03 · 多模态素材 BYOK</text>
  <text x="626" y="136" font-size="15" font-weight="700" fill="var(--text)">Model Gateway 素材生成</text>
  <text x="626" y="155" font-size="11.5" fill="var(--muted)">自带 API Key 或使用 OpenDesign Go</text>

  <rect x="626" y="176" width="212" height="44" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="638" y="195" font-size="12" font-weight="600" fill="var(--text)">主视觉、角色精灵与贴图</text>
  <text x="638" y="210" font-size="10.8" fill="var(--muted)">GPT Image 2.6 · Seedream 5.5 · FLUX</text>

  <rect x="626" y="228" width="212" height="44" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="638" y="247" font-size="12" font-weight="600" fill="var(--text)">背景音乐、配音与音效</text>
  <text x="638" y="262" font-size="10" fill="var(--muted)">ElevenLabs · Suno · BytePlus · WebAudio</text>

  <rect x="626" y="280" width="212" height="44" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="638" y="299" font-size="12" font-weight="600" fill="var(--text)">过场动画与动效参考</text>
  <text x="638" y="314" font-size="10.8" fill="var(--muted)">Wan 2.7 · Seedance 2.5 · I2V 片段</text>

  <rect x="626" y="332" width="212" height="44" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="638" y="351" font-size="12" font-weight="600" fill="var(--text)">3D 场景与模型扩展</text>
  <text x="638" y="366" font-size="10.8" fill="var(--muted)">Three.js + CC0 套件 + 3D 网关预留位</text>

  <!-- Arrow 3->4 -->
  <line x1="860" y1="246" x2="892" y2="246" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Column 4 -->
  <rect x="900" y="88" width="228" height="316" rx="12" fill="var(--surface-green)" stroke="var(--border-green)"/>
  <text x="916" y="114" class="mono" font-size="11" font-weight="700" fill="var(--green)">04 · 自动验证与分发</text>
  <text x="916" y="136" font-size="15" font-weight="700" fill="var(--text)">QA → 上架 → 变现</text>
  <text x="916" y="155" font-size="11.5" fill="var(--muted)">闭环质量检查与多端交付</text>

  <rect x="916" y="176" width="196" height="64" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="928" y="196" font-size="12" font-weight="600" fill="var(--text)">自动化游戏 QA</text>
  <text x="928" y="212" font-size="10.8" fill="var(--muted)">50-tick 校验 · 三档仿真通关</text>
  <text x="928" y="227" font-size="10.8" fill="var(--muted)">无头 Chrome 真操作试玩</text>

  <rect x="916" y="248" width="196" height="62" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="928" y="268" font-size="12" font-weight="600" fill="var(--text)">自动封面与预告片</text>
  <text x="928" y="284" font-size="10.8" fill="var(--muted)">1280×720 画布截图封面</text>
  <text x="928" y="299" font-size="10.8" fill="var(--muted)">自动录制 19 秒实机 MP4</text>

  <rect x="916" y="318" width="196" height="68" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="928" y="338" font-size="12" font-weight="600" fill="var(--text)">分享发布与变现路径</text>
  <text x="928" y="354" font-size="10.8" fill="var(--muted)">一键在线链接 · 9:16 试玩广告</text>
  <text x="928" y="369" font-size="10.8" fill="var(--muted)">微信/抖音小游戏指南（路线图）</text>
</svg>
