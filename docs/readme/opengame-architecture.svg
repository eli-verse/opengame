<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-labelledby="arch-title">
  <title id="arch-title">OpenGame Architecture — From Agent &amp; Template Remix to Automated QA, Web Share, and Monetization</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --surface-accent: #eef6ff;
      --surface-green: #ecfdf5;
      --border: #d8dee6;
      --border-accent: #93c5fd;
      --border-green: #86efac;
      --text: #111827;
      --muted: #4b5563;
      --chip-bg: #ffffff;
      --arrow: #64748b;
      --accent: #0284c7;
      --green: #059669;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface-accent: #132238;
        --surface-green: #10261e;
        --border: #30363d;
        --border-accent: #1d4ed8;
        --border-green: #15803d;
        --text: #f0f6fc;
        --muted: #9ca3af;
        --chip-bg: #0d1117;
        --arrow: #8b949e;
        --accent: #38bdf8;
        --green: #34d399;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <rect width="1160" height="440" rx="16" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>

  <!-- Header -->
  <text x="32" y="40" font-size="18" font-weight="700" fill="var(--text)">OpenGame Full-Stack Creation Pipeline</text>
  <text x="32" y="61" font-size="12.5" fill="var(--muted)">One open-source local runtime connecting 22 AI agents, multimodal BYOK models, automated game QA, and end-to-end publishing.</text>

  <!-- Column 1: BYOA & Entry -->
  <rect x="32" y="88" width="236" height="316" rx="12" fill="var(--surface)" stroke="var(--border)"/>
  <text x="48" y="114" class="mono" font-size="11" font-weight="700" fill="var(--accent)">01 · BYOA &amp; STARTING POINT</text>
  <text x="48" y="136" font-size="15" font-weight="700" fill="var(--text)">Your Local AI Agent</text>
  <text x="48" y="155" font-size="11.5" fill="var(--muted)">DeepSeek · Claude Code · Codex</text>
  <text x="48" y="171" font-size="11.5" fill="var(--muted)">WorkBuddy · Gemini · Cursor + 16</text>

  <rect x="48" y="190" width="204" height="54" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="60" y="211" font-size="12.5" font-weight="600" fill="var(--text)">One-Click Template Remix</text>
  <text x="60" y="229" font-size="11" fill="var(--muted)">26 playable 3D / 2D / 9:16 kits</text>

  <rect x="48" y="256" width="204" height="54" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="60" y="277" font-size="12.5" font-weight="600" fill="var(--text)">One-Click Re-style / Reskin</text>
  <text x="60" y="295" font-size="10.5" fill="var(--muted)">Swap art, theme, cast &amp; audio</text>

  <rect x="48" y="322" width="204" height="54" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="60" y="343" font-size="12.5" font-weight="600" fill="var(--text)">Original Brief from Scratch</text>
  <text x="60" y="361" font-size="11" fill="var(--muted)">Prompt + genre + style + setting</text>

  <!-- Arrow 1->2 -->
  <line x1="274" y1="246" x2="306" y2="246" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Column 2: OpenGame Studio + MCP -->
  <rect x="314" y="88" width="250" height="316" rx="12" fill="var(--surface-accent)" stroke="var(--border-accent)"/>
  <text x="330" y="114" class="mono" font-size="11" font-weight="700" fill="var(--accent)">02 · STUDIO &amp; MCP RUNTIME</text>
  <text x="330" y="136" font-size="15" font-weight="700" fill="var(--text)">OpenGame Studio</text>
  <text x="330" y="155" font-size="11.5" fill="var(--muted)">Local Studio (/studios/game) + stdio MCP</text>

  <rect x="330" y="176" width="218" height="62" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="342" y="197" font-size="12.5" font-weight="600" fill="var(--text)">12 Game MCP Tools</text>
  <text x="342" y="214" class="mono" font-size="9.6" fill="var(--muted)">create, write, validate, simulate</text>
  <text x="342" y="228" class="mono" font-size="9.6" fill="var(--muted)">playtest, cover, trailer, publish</text>

  <rect x="330" y="248" width="218" height="62" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="342" y="269" font-size="12.5" font-weight="600" fill="var(--text)">openmotion-game Skill</text>
  <text x="342" y="286" font-size="11" fill="var(--muted)">18 engineering handbooks: 3C, feel,</text>
  <text x="342" y="300" font-size="11" fill="var(--muted)">2D/3D animation, playable ads, gates</text>

  <rect x="330" y="320" width="218" height="62" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="342" y="341" font-size="12.5" font-weight="600" fill="var(--text)">Game as Editable Code</text>
  <text x="342" y="358" font-size="11" fill="var(--muted)">HTML5 + JS + vendored Three.js</text>
  <text x="342" y="372" font-size="11" fill="var(--muted)">design/plan.md · style.md · assets.csv</text>

  <!-- Arrow 2->3 -->
  <line x1="570" y1="246" x2="602" y2="246" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Column 3: Full-Stack Multimodal BYOK -->
  <rect x="610" y="88" width="244" height="316" rx="12" fill="var(--surface)" stroke="var(--border)"/>
  <text x="626" y="114" class="mono" font-size="11" font-weight="700" fill="var(--accent)">03 · MULTIMODAL BYOK</text>
  <text x="626" y="136" font-size="15" font-weight="700" fill="var(--text)">Model Gateway &amp; Assets</text>
  <text x="626" y="155" font-size="11.5" fill="var(--muted)">Your keys or OpenDesign Go</text>

  <rect x="626" y="176" width="212" height="44" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="638" y="195" font-size="12" font-weight="600" fill="var(--text)">Key Art, Sprites &amp; Textures</text>
  <text x="638" y="210" font-size="10.8" fill="var(--muted)">GPT Image 2.6 · Seedream 5.5 · FLUX</text>

  <rect x="626" y="228" width="212" height="44" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="638" y="247" font-size="12" font-weight="600" fill="var(--text)">Music, Voice &amp; SFX</text>
  <text x="638" y="262" font-size="9.6" fill="var(--muted)">ElevenLabs · Suno · BytePlus · Web Audio</text>

  <rect x="626" y="280" width="212" height="44" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="638" y="299" font-size="12" font-weight="600" fill="var(--text)">Cutscenes &amp; Motion</text>
  <text x="638" y="314" font-size="10.8" fill="var(--muted)">Wan 2.7 · Seedance 2.5 · I2V clips</text>

  <rect x="626" y="332" width="212" height="44" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="638" y="351" font-size="12" font-weight="600" fill="var(--text)">3D Scenes &amp; Assets</text>
  <text x="638" y="366" font-size="10.8" fill="var(--muted)">Three.js + CC0 kits + 3D gateway slot</text>

  <!-- Arrow 3->4 -->
  <line x1="860" y1="246" x2="892" y2="246" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Column 4: QA -> Ship & Monetize -->
  <rect x="900" y="88" width="228" height="316" rx="12" fill="var(--surface-green)" stroke="var(--border-green)"/>
  <text x="916" y="114" class="mono" font-size="11" font-weight="700" fill="var(--green)">04 · VERIFY &amp; SHIP</text>
  <text x="916" y="136" font-size="15" font-weight="700" fill="var(--text)">QA → Publish → Earn</text>
  <text x="916" y="155" font-size="11.5" fill="var(--muted)">Automated checks &amp; delivery</text>

  <rect x="916" y="176" width="196" height="64" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="928" y="196" font-size="12" font-weight="600" fill="var(--text)">Automated Game QA</text>
  <text x="928" y="212" font-size="10.8" fill="var(--muted)">50-tick check · 3-tier sim</text>
  <text x="928" y="227" font-size="10.8" fill="var(--muted)">Headless Chrome playtest</text>

  <rect x="916" y="248" width="196" height="62" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="928" y="268" font-size="12" font-weight="600" fill="var(--text)">Covers &amp; Trailers</text>
  <text x="928" y="284" font-size="10.8" fill="var(--muted)">1280×720 canvas capture</text>
  <text x="928" y="299" font-size="10.8" fill="var(--muted)">Auto 19s MP4 trailer</text>

  <rect x="916" y="318" width="196" height="68" rx="8" fill="var(--chip-bg)" stroke="var(--border)"/>
  <text x="928" y="338" font-size="12" font-weight="600" fill="var(--text)">Publish &amp; Monetize</text>
  <text x="928" y="354" font-size="10.8" fill="var(--muted)">Web Share · 9:16 Playable Ads</text>
  <text x="928" y="369" font-size="10.8" fill="var(--muted)">WeChat / Douyin / Web (Roadmap)</text>
</svg>
